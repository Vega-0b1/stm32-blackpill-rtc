# OpenOCD board configuration for the WeAct BlackPill (STM32F411CEU6).
#
# OpenOCD ships 379 board files and none of them is this board -- there is a
# stm32f103c8_blue_pill.cfg, and every F4 entry is an ST dev board (Discovery,
# Nucleo). A "board" file for a bare module like this one is just its two
# halves: the debug adapter, and the chip.
#
# Adapter: WeAct MiniDebugger running ST-Link V2.1 firmware, which enumerates
# as 0483:3752 "STM32 STLink". If you ever reflash it to DAPLink, swap the
# line below for interface/cmsis-dap.cfg -- nothing else here changes.
source [find interface/stlink.cfg]

# hla_swd, not swd: ST-Link V2 is a "high level adapter" -- the probe firmware
# implements the debug protocol itself rather than exposing raw SWD lines, so
# OpenOCD drives it through the hla layer. Plain `swd` fails on this adapter.
transport select hla_swd

source [find target/stm32f4x.cfg]

# No SRST. The BlackPill's 4-pin SWD header is 3V3/GND/SWDIO/SWCLK only -- NRST
# is not on it, so any srst_* setting makes OpenOCD pulse a line that is not
# connected and `reset halt` then times out with "Not halted". `none` falls back
# to the Cortex-M SYSRESETREQ software reset over SWD, which needs no extra pin.
reset_config none separate
